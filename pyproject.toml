[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "het-ai"
version = "1.0.0"
description = "A framework-agnostic MLOps training DSL with Optuna integration."
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Chen Zhang", email="chen2.zhang@szhittech.com" }
]
keywords = ["mlops", "automl", "automation", "dsl", "artifical-intelligence", "framework-agnostic"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
  "optuna>=3.5.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/HeT-FTI/het-ai"
Repository = "https://github.com/HeT-FTI/het-ai"
Documentation = "https://het-ai.readthedocs.io/"
Issues = "https://github.com/HeT-FTI/het-ai/issues"
Changelog = "https://github.com/HeT-FTI/het-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
torch = [
  "torch>=2.1.0",
  "onnx>=1.15.0",
  "onnxscript>=0.1.0",
  "onnxruntime>=1.16.0"
]
tensorflow = [
  "tensorflow>=2.14.0",
  "Pillow>=10.0.0"
]
sklearn = [
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0"
]
bayes = [
  "pymc>=5.9.0",
  "arviz>=0.17.0"
]
dev = [
  "pytest>=7.4.0",
  "build>=1.0.0",
  "twine>=4.0.0"
]
examples = [
  "pytest>=7.4.0",
  "torch>=2.1.0",
  "onnx>=1.15.0",
  "onnxscript>=0.1.0",
  "onnxruntime>=1.16.0",
  "tensorflow>=2.14.0",
  "Pillow>=10.0.0",
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0",
  "pymc>=5.9.0",
  "netCDF4>=1.6.0"
]

dvc = [
    "dvc>=3.0.0",
    "requests>=2.28.0",
]
mlflow = [
    "mlflow>=2.10.0",
]
# all-in-one 安装
platform = [
    "dvc>=3.0.0",
    "requests>=2.28.0",
    "mlflow>=2.10.0",
]

# Documentation
docs = [
    "sphinx>=7.2",
    "furo>=2024.0",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-design>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pinned rule set so CI results are deterministic across ruff versions.
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade (modern typing)
  "RUF",  # ruff-specific rules
  "FURB", # refurb
  "G",    # logging
  "PLW",  # pylint warnings
  "S",    # bandit
  "BLE",  # blind except
]
ignore = [
  # The codebase intentionally uses Chinese comments and Unicode symbols;
  # these rules would otherwise flag every non-ASCII comment/string.
  "RUF001", # ambiguous-unicode-character-string
  "RUF003", # ambiguous-unicode-character-comment
  # f-strings in logging calls are an accepted style choice here.
  "G004",
]
